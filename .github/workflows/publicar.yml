# Testa, constrói e publica o site no GitHub Pages a cada envio para a branch main.
# Ative em: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar código
        run: npm run verificar
      - name: Testes
        run: npm run testar
      - name: Construir o site
        env:
          VITE_ENDERECO_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VITE_CAMINHO_BASE: /${{ github.event.repository.name }}/
          VITE_DEMONSTRACAO: 'true'
        run: npm run construir
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-pronto

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
