# Avisa (e abre pedidos de atualização) quando alguma biblioteca do site
# ou das automações do GitHub tiver versão nova ou correção de segurança.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      bibliotecas:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
