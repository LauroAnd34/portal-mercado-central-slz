<!-- Aviso discreto de "versão de apresentação": aparece quando VITE_DEMONSTRACAO=true (ex.: GitHub Pages) -->
<div class="faixa-demonstracao" data-mostrar="%VITE_DEMONSTRACAO%" role="note">
  Proposta de portal para o Mercado Central · versão de apresentação, não é o site oficial da
  Prefeitura
</div>
<!-- Barra superior no padrão eMAG: atalhos de teclado + acessibilidade rápida -->
<div class="barra-gov nao-imprimir">
  <div class="container barra-gov__conteudo">
    <nav class="barra-gov__atalhos" aria-label="Atalhos de acessibilidade">
      <ul>
        <li>
          <a href="#conteudo">Ir para o conteúdo</a>
        </li>
        <li>
          <a href="#menu-principal">Ir para o menu</a>
        </li>
        <li>
          <a href="#rodape">Ir para o rodapé</a>
        </li>
      </ul>
    </nav>
    <ul class="barra-gov__acoes" aria-label="Ajustes rápidos">
      <li>
        <button type="button" class="barra-gov__botao" data-acao="contraste" aria-pressed="false">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" />
          </svg>
          Alto contraste
        </button>
      </li>
      <li>
        <div class="barra-gov__fonte" role="group" aria-label="Tamanho do texto">
          <button type="button" class="barra-gov__botao" data-acao="fonte-menor">
            A−<span class="somente-leitor"> diminuir texto</span>
          </button>
          <button type="button" class="barra-gov__botao" data-acao="fonte-padrao">
            A<span class="somente-leitor"> tamanho padrão</span>
          </button>
          <button type="button" class="barra-gov__botao" data-acao="fonte-maior">
            A+<span class="somente-leitor"> aumentar texto</span>
          </button>
        </div>
      </li>
    </ul>
  </div>
</div>
<!-- Botão flutuante de acessibilidade: abre o painel; pode ser arrastado para a lateral esquerda ou direita -->
<button
  type="button"
  class="botao-flutuante-acessibilidade"
  data-abre-painel-acessibilidade
  data-botao-flutuante
  aria-haspopup="dialog"
  aria-label="Acessibilidade: abrir opções (letras, contraste, Libras, leitura em voz alta)"
  title="Acessibilidade — clique para abrir ou arraste para mudar de lugar"
>
  <svg aria-hidden="true" viewBox="0 0 32 32" width="34" height="34">
    <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="2" />
    <circle cx="16" cy="8.2" r="2.3" fill="currentColor" />
    <path
      d="M7.5 11.6 16 13.2l8.5-1.6M16 13.2v6.1m0 0-3.6 6.9M16 19.3l3.6 6.9"
      fill="none"
      stroke="currentColor"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
  <img
    class="botao-flutuante__libras"
    src="./img/oficial/maos-libras.svg"
    alt=""
    width="22"
    height="22"
  />
</button>
