<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="t d">
  <title id="t">Ilustração da fachada do Mercado Central</title>
  <desc id="d">Desenho em estilo Art Déco: um edifício simétrico com torre central escalonada, linhas verticais na platibanda, marquise de concreto e escadaria central, com o letreiro Mercado Central. Ao fundo, céu com sol e, à frente, barracas coloridas.</desc>
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39a6de"/><stop offset="1" stop-color="#bfe3f5"/></linearGradient>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6e3"/><stop offset="1" stop-color="#f1e4c2"/></linearGradient>
    <clipPath id="arco"><rect x="0" y="0" width="560" height="420" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#arco)">
    <rect width="560" height="420" fill="url(#ceu)"/>
    <circle cx="455" cy="88" r="44" fill="#faea25"/>
    <circle cx="455" cy="88" r="62" fill="#faea25" opacity=".25"/>
    <!-- palmeiras de babaçu estilizadas -->
    <g fill="#2f6b3a"><path d="M40 330 q8-90 4-150 l6 0 q4 60 -2 150z"/><path d="M47 182 q-40-10-62 18 q34-8 62-12z"/><path d="M47 182 q40-14 66 10 q-36-4 -66 -6z"/><path d="M47 182 q-14-36 6-60 q-2 34 -2 58z"/><path d="M47 182 q30-30 60-26 q-30 10 -56 30z"/></g>
    <!-- corpo do edifício -->
    <rect x="80" y="170" width="400" height="190" fill="url(#parede)"/>
    <!-- torre central escalonada -->
    <rect x="215" y="120" width="130" height="60" fill="#fdf6e3"/>
    <rect x="235" y="92" width="90" height="34" fill="#fdf6e3"/>
    <rect x="255" y="70" width="50" height="26" fill="#fdf6e3"/>
    <g stroke="#144670" stroke-width="3"><path d="M268 74v18M280 72v20M292 74v18"/></g>
    <!-- linhas verticais na platibanda -->
    <g fill="#bbd050"><rect x="100" y="178" width="8" height="34"/><rect x="118" y="178" width="8" height="34"/><rect x="434" y="178" width="8" height="34"/><rect x="452" y="178" width="8" height="34"/></g>
    <g fill="#56b2b8"><rect x="226" y="132" width="6" height="40"/><rect x="328" y="132" width="6" height="40"/></g>
    <!-- letreiro -->
    <rect x="160" y="186" width="240" height="34" rx="3" fill="#144670"/>
    <text x="280" y="209" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">MERCADO CENTRAL</text>
    <!-- marquise -->
    <rect x="70" y="236" width="420" height="12" fill="#144670"/>
    <rect x="70" y="248" width="420" height="5" fill="#113859" opacity=".5"/>
    <!-- portas e janelas -->
    <g fill="#175284">
      <rect x="104" y="270" width="44" height="90" rx="2"/><rect x="168" y="270" width="44" height="90" rx="2"/>
      <rect x="348" y="270" width="44" height="90" rx="2"/><rect x="412" y="270" width="44" height="90" rx="2"/>
    </g>
    <g fill="#39a6de" opacity=".55"><rect x="110" y="276" width="32" height="26"/><rect x="174" y="276" width="32" height="26"/><rect x="354" y="276" width="32" height="26"/><rect x="418" y="276" width="32" height="26"/></g>
    <rect x="240" y="262" width="80" height="98" fill="#0b2a45"/>
    <path d="M240 262h80v14h-80z" fill="#faea25"/>
    <!-- escadaria -->
    <g fill="#d9c9a0"><rect x="226" y="360" width="108" height="8"/><rect x="216" y="368" width="128" height="8"/><rect x="206" y="376" width="148" height="8"/></g>
    <rect x="0" y="384" width="560" height="36" fill="#9a8f7a"/>
    <!-- barracas coloridas (faixa de 7 cores) -->
    <g>
      <path d="M20 352 l40 0 l-6 14 l-28 0z" fill="#faea25"/><rect x="26" y="366" width="28" height="22" fill="#fff" opacity=".9"/>
      <path d="M494 352 l46 0 l-6 14 l-34 0z" fill="#79c096"/><rect x="500" y="366" width="34" height="22" fill="#fff" opacity=".9"/>
      <circle cx="40" cy="378" r="5" fill="#c32146"/><circle cx="510" cy="378" r="5" fill="#f2be09"/><circle cx="522" cy="380" r="5" fill="#2f6b3a"/>
    </g>
    <rect x="0" y="414" width="560" height="6" fill="#144670"/>
    <g><rect x="0" y="408" width="80" height="6" fill="#faea25"/><rect x="80" y="408" width="80" height="6" fill="#dadb32"/><rect x="160" y="408" width="80" height="6" fill="#bbd050"/><rect x="240" y="408" width="80" height="6" fill="#9ac670"/><rect x="320" y="408" width="80" height="6" fill="#79c096"/><rect x="400" y="408" width="80" height="6" fill="#56b2b8"/><rect x="480" y="408" width="80" height="6" fill="#39a6de"/></g>
  </g>
</svg>
