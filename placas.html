<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- @include cabeca.html -->
    <title>Placas com QR code | Portal do Mercado Central — Prefeitura de São Luís</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!-- @include cabecalho.html pagina=nenhuma -->
    <main id="conteudo" tabindex="-1">
      <section class="secao" aria-labelledby="placas-titulo">
        <div class="container">
          <header class="titulo-modulo">
            <h1 id="placas-titulo">Placas com QR code</h1>
            <span class="titulo-modulo__sub">Para imprimir e colocar nos pontos turísticos</span>
          </header>
          <p class="lead nao-imprimir">
            Cada placa leva direto à página do lugar no mapa, com a história, a distância e o
            caminho. Escolha os lugares e imprima em papel A4 (uma placa por página ou quatro por
            folha).
          </p>
          <div class="placas__acoes nao-imprimir">
            <label class="placas__opcao">
              <input type="checkbox" data-quatro-por-folha /> Quatro placas por folha
            </label>
            <button type="button" class="botao" data-imprimir-placas>Imprimir placas</button>
          </div>
          <ul class="placas" data-placas></ul>
        </div>
      </section>
    </main>
    <!-- @include rodape.html -->
    <script type="module" src="./src/paginas/placas.js"></script>
  </body>
</html>
